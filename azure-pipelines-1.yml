trigger:
  branches:
    include:
      - master
      - devops-upgrade

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dockerImageName: 'devopsdemo-api'

steps:
- checkout: self
  displayName: 'Checkout repository'

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore DevOpsDemo.sln
  displayName: 'Restore dependencies'

- script: dotnet build DevOpsDemo.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Build application'

- script: >
    dotnet publish DevOpsDemo/DevOpsDemo.csproj
    --configuration $(buildConfiguration)
    --no-build
    --output $(Build.ArtifactStagingDirectory)/app
  displayName: 'Publish application'

- script: |
    docker build \
      -t $(dockerImageName):$(Build.BuildId) \
      .
  displayName: 'Build Docker image'

- script: |
    docker image inspect $(dockerImageName):$(Build.BuildId)
  displayName: 'Validate Docker image'

- script: |
    export DB_PASSWORD='CiValidation!2026'
    docker compose config --quiet
  displayName: 'Validate Docker Compose configuration'

- task: PublishBuildArtifacts@1
  displayName: 'Publish application artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/app'
    ArtifactName: 'devopsdemo-api'