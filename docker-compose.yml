services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devopsdemo-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - devops-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devopsdemo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DevOpsDemoDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops-network

  nginx:
    image: nginx:alpine
    container_name: devopsdemo-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - devops-network

volumes:
  sql_data:

networks:
  devops-network: